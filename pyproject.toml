[project]
name = "zeos-types"
version = "0.1.0"
description = "Shared wire types for the Zeos ecosystem"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "redis>=5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "jsonschema>=4.0",
]

[tool.setuptools.packages.find]
where = ["python"]
